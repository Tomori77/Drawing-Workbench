name = "drawing-workbench"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

# 部署前自动构建前端。命令在 apps/worker 目录下执行；pnpm 会向上查找
# pnpm-workspace.yaml，因此 --filter 能正确定位到 web 包。
[build]
command = "pnpm --filter @drawing-workbench/web build"

# 静态资源：指向 web 构建产物（由上面的 [build] 自动生成）。
# run_worker_first=true：所有请求先经 Worker，由 staticGate 做门禁分流
# （静态子资源放行、未登录的文档导航重定向 /login，SPA 路由回退 index.html）。
[assets]
directory = "../web/dist"
binding = "ASSETS"
run_worker_first = true

# 非敏感变量；敏感值（OWNER_PASSWORD / FRIEND_PASSWORD / SESSION_SECRET / ENCRYPTION_KEY）
# 通过 `wrangler secret put` / `wrangler secret bulk` 写入，不写进本文件。
[vars]
APP_ENV = "production"

# D1：会话元数据、上游配置、API Key、配额与生成记录。
[[d1_databases]]
binding = "DB"
database_name = "drawing-workbench"
database_id = "eb34b8d5-b09b-42c7-9255-3fb3aa27ff26"
migrations_dir = "migrations"

# R2：生成的图片对象。
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "drawing-workbench"

# 自定义域名：由 Cloudflare 自动创建 DNS 记录与证书。
[[routes]]
pattern = "dw.646677.xyz"
custom_domain = true

# 自动签到/余额刷新/冷却回收：每 5 分钟唤醒一次，由 scheduled 入口处理。
[triggers]
crons = ["*/5 * * * *"]
